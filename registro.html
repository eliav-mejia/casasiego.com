<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Google Tag Manager -->

  <!-- Crear cuenta (v1.3.3). URL propia: https://casasiego.com/registro.html. NO se enlaza desde el pop-up de acceso
       de la portada (ese solo inicia sesión) ni desde el menú: se comparte a mano o en campañas (?marca=justo&campana=…).
       Cuentas con Google, Microsoft (azure), LinkedIn (linkedin_oidc) o Facebook. Diseño: mismo estilo que el pop-up (css/acceso.css). -->
  <script src="js/medicion.js?v=1.0.0" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta — Casa Siego®</title>
  <meta name="description" content="Crea tu cuenta de Casa Siego con Google, Microsoft, LinkedIn o Facebook.">
  <meta name="keywords" content="trajes a medida, trajes personalizados, camisería, sastrería, trajes ejecutivos, Ciudad de México, Madrid">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <link rel="canonical" href="https://casasiego.com/registro.html">
  <meta name="theme-color" content="#4A1621">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ledger&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Spectral:ital@1&family=Parisienne&display=swap">

  <link rel="stylesheet" href="css/site.css?v=1.1.1">
  <link rel="stylesheet" href="css/registro.css?v=2.0.0">
  <script src="js/supabase-config.js?v=1.0.0" defer></script>
  <script src="js/registro-config.js?v=1.1.0" defer></script>
  <script src="js/registro.js?v=2.0.0" defer></script>
</head>
<body class="registro">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WHTQ77F9" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="registro__card" id="carta" aria-labelledby="carta-titulo">
    <a class="registro__volver" href="visitante.html">&larr; Casa Siego</a>

    <header class="registro__cabeza">
      <p class="eyebrow eyebrow--gold">Crear cuenta</p>
      <h1 class="registro__titulo wordmark" id="carta-titulo"><span class="wordmark__casa">CASA</span> <span class="wordmark__siego">Siego</span><sup class="wordmark__r">&reg;</sup></h1>
      <p class="registro__lede">Cuéntanos quién eres y continúa con tu cuenta de Google, Microsoft, LinkedIn o Facebook.</p>
      <p class="registro__fecha" id="fecha">Ciudad de México</p>
    </header>

    <form class="registro__form" id="formulario" novalidate autocomplete="on">
      <section class="registro__paso" aria-labelledby="paso-1">
        <h2 class="registro__paso-titulo" id="paso-1"><span class="registro__num">1</span> <span id="desplegable-texto">Tus datos</span></h2>
        <div class="registro__campos" id="desplegable">
          <label class="campo" data-solo="registro">
            <span class="campo__etiqueta">Nombre y apellido</span>
            <input class="t" name="nombre" autocomplete="name" maxlength="120">
          </label>

          <div class="campos-par" data-solo="registro">
            <label class="campo">
              <span class="campo__etiqueta">País</span>
              <select class="t" name="pais">
                <option value="MX">México</option><option value="ES">España</option><option value="US">Estados Unidos</option>
                <option value="CO">Colombia</option><option value="AR">Argentina</option><option value="CL">Chile</option>
                <option value="PE">Perú</option><option value="FR">Francia</option><option value="CH">Suiza</option>
                <option value="">Otro lugar</option>
              </select>
            </label>
            <label class="campo">
              <span class="campo__etiqueta">Idioma</span>
              <select class="t" name="idioma">
                <option value="es">Español</option><option value="en">Inglés</option>
              </select>
            </label>
          </div>

          <!-- Correo: lo da el proveedor; aparece (solo lectura) al volver de Google / Microsoft / LinkedIn / Facebook -->
          <label class="campo" id="campo-email" hidden>
            <span class="campo__etiqueta">Correo electrónico</span>
            <input class="t" name="email" type="email" autocomplete="email" spellcheck="false" maxlength="254" readonly>
          </label>

          <!-- Atributos por marca / campaña (jsonb): los pinta registro.js -->
          <div class="atributos" id="atributos" data-solo="registro"></div>

          <!-- Consentimientos (columnas legales): los pinta registro.js desde identidad.avisos -->
          <fieldset class="consentimientos" id="consentimientos" data-solo="registro">
            <legend class="campo__etiqueta">Avisos</legend>
          </fieldset>
        </div>
      </section>

      <section class="registro__paso" aria-labelledby="sociales-titulo">
        <h2 class="registro__paso-titulo" id="sociales-titulo"><span class="registro__num">2</span> Continúa con</h2>
        <div class="sociales">
          <button type="button" class="social" data-proveedor="google">
            <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span>Google</span>
          </button>
          <button type="button" class="social" data-proveedor="azure">
            <svg viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>
            <span>Microsoft</span>
          </button>
          <button type="button" class="social" data-proveedor="linkedin_oidc">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#0A66C2" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
            <span>LinkedIn</span>
          </button>
          <button type="button" class="social" data-proveedor="facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#1877F2" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg>
            <span>Facebook</span>
          </button>
        </div>
      </section>

      <!-- Código por correo: reservado para cuando exista SMTP propio (hoy no se ofrece correo como vía de alta) -->
      <div class="posdata" id="posdata" hidden>
        <label class="campo">
          <span class="campo__etiqueta">Código de 6 dígitos</span>
          <input class="t t--codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
        </label>
        <button type="button" class="registro__enlace" id="reenviar">¿No llegó? Pedir otro código</button>
      </div>

      <div class="turnstile" id="turnstile" hidden></div>

      <p class="nota-margen" id="nota" role="status" aria-live="polite"></p>

      <!-- Solo visible al volver del proveedor si faltan datos: termina el registro con la sesión ya abierta -->
      <button class="button registro__enviar" type="submit" id="enviar" hidden><span id="enviar-texto">Completar registro</span></button>
      <span id="firma" hidden></span>

      <p class="registro__fine">¿Ya eres miembro? Inicia sesión con el icono de la barra superior en <a href="index.html#acceso">casasiego.com</a>.</p>
    </form>
  </main>

  <!-- Respuesta de la Casa: la misma tarjeta blanca del pop-up -->
  <div class="respuesta" id="respuesta" hidden>
    <div class="respuesta__tarjeta" role="alertdialog" aria-modal="true" aria-labelledby="respuesta-texto">
      <hr class="rule rule--short rule--gold">
      <p class="respuesta__texto" id="respuesta-texto"></p>
      <p class="respuesta__firma wordmark"><span class="wordmark__casa">CASA</span> <span class="wordmark__siego">Siego</span><sup class="wordmark__r">&reg;</sup></p>
    </div>
  </div>

  <noscript><p class="sin-js">Para crear tu cuenta necesitas activar JavaScript. También puedes escribirnos a info@casasiego.com.</p></noscript>
</body>
</html>
