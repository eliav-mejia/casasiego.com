html[data-tema="casasiego.com"] {
  
  --wine:        #6B1E2C;
  --wine-deep:   #4A1621;
  --wine-ink:    #3B1A1F;
  --beige:       #EEE4D3;
  --beige-soft:  #F7F2EA;
  --brass:       #B0905E;
  --brass-light: #D6C09A;
  --taupe:       #6F5E57;
  --thera-white: #FFFFFF;
  --font-display: "Cinzel", "Trajan Pro", "Cormorant SC", Georgia, serif;
  --font-section: "Bodoni Moda", "GFS Didot", "Didot", "Bodoni 72", Georgia, serif;
  --font-body:    "EB Garamond", "Garamond", "Iowan Old Style", Georgia, serif;
  --font-meta:    "Spectral", "EB Garamond", Georgia, serif;

  --c-navy: var(--wine-ink);  --c-navy-raised: var(--wine-deep);
  --c-azul: var(--wine);      --c-azul-suave: var(--beige-soft); --c-azul-linea: var(--brass-light);
  --c-gris: var(--taupe);     --c-gris-claro: #A8988F;           --c-gris-linea: #E6DAC6;
  --c-superficie: var(--thera-white); --c-blanco: var(--thera-white);
  --f-texto: var(--font-body); --f-titulo: var(--font-section);
  --r-xl: 0; --r-2xl: 0; --r-3xl: 0; --r-btn: 0;
}
html[data-tema="casasiego.com"] body { font-size: 1.0625rem; font-feature-settings: "onum" 1, "kern" 1, "liga" 1; }
html[data-tema="casasiego.com"] ::selection { background: var(--wine); color: var(--thera-white); }
html[data-tema="casasiego.com"] h1, html[data-tema="casasiego.com"] h2 { font-weight: 600; letter-spacing: 0.02em; }
html[data-tema="casasiego.com"] .marca { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.95rem; }
html[data-tema="casasiego.com"] .kicker { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.3em; color: var(--brass); }


html[data-tema="casasiego.com"] .btn { font-family: var(--font-display); font-weight: 400; font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; }
html[data-tema="casasiego.com"] .btn-primario:hover:not(:disabled) { background: var(--wine-deep); }


html[data-tema="casasiego.com"] .servicio { border-color: color-mix(in srgb, var(--brass) 45%, transparent); }
html[data-tema="casasiego.com"] .servicio--sel { border-color: var(--brass); border-top: 3px solid var(--wine); background: var(--beige-soft); }


html[data-tema="casasiego.com"] .cal-dia { border-color: var(--brass); background: var(--thera-white); color: var(--wine-ink); }
html[data-tema="casasiego.com"] .cal-dia:hover { background: var(--beige-soft); }
html[data-tema="casasiego.com"] .cal-dia__semana,
html[data-tema="casasiego.com"] .cal-dia__mes { font-family: var(--font-display); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; }
html[data-tema="casasiego.com"] .cal-dia__num { font-family: var(--font-body); font-weight: 400; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
html[data-tema="casasiego.com"] .cal-dia--sel { background: var(--wine); border-color: var(--wine); color: var(--thera-white); }
html[data-tema="casasiego.com"] .cal-dia--sel .cal-dia__semana,
html[data-tema="casasiego.com"] .cal-dia--sel .cal-dia__mes { color: var(--brass-light); }
html[data-tema="casasiego.com"] .cal-hora { border-color: var(--brass); font-family: var(--font-body); font-variant-numeric: tabular-nums; font-size: 1.05rem; letter-spacing: 0.05em; text-transform: none; }
html[data-tema="casasiego.com"] .cal-hora--sel { background: var(--wine); border-color: var(--wine); color: var(--thera-white); }
