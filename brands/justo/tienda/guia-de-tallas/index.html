<body data-root="../../../../">

  <div id="root">
    <noscript>
      <h1>Guía de tallas de sacos Justo</h1>
      <p>Guía de tallas de los sacos de Justo: Chico, Mediano, Grande y Extra grande, equivalencias MX, EU y US, cómo medirte y medidas de cada saco.</p>
      <nav aria-label="Principal">
        <ul>
          <li><a href="../">Ver los sacos</a></li>
          <li><a href="../../">Justo, sastrería a medida</a></li>
        </ul>
      </nav>
    </noscript>
  </div>
  <noscript><p style="padding:2rem;font-family:Georgia,serif">La tienda necesita JavaScript. Escríbenos a <a href="mailto:info@casasiego.com">info@casasiego.com</a> para hacer tu pedido.</p></noscript>

  <script type="text/babel" src="../../../../brands/justo/tienda/js/tienda.jsx?v=1.1.4"></script>
  <script type="text/babel">
    // Size guide: body sizes (db/tallas.json), how to measure, finder, and each jacket's garment table (db/productos.json).
    const GuidePage = () => {
        const catalog = useCatalog();
        const [tab, setTab] = useState(0);
        useReveal([catalog.status]);
        if (catalog.status === 'loading') return <div className="max-w-[1400px] mx-auto px-4 md:px-10 py-16"><Skeleton n={2} /></div>;
        if (catalog.status === 'error') return <LoadError />;
        const product = catalog.products[tab];
        return (
            <>
                <PageHero kicker="Tienda Justo" title="Guía de tallas"
                    intro="Cuatro tallas: Chico, Mediano, Grande y Extra grande. Elige por pecho y hombro, que no se pueden ajustar; mangas y cintura las dejamos a tu medida en el taller." />

                <section className="max-w-[1400px] mx-auto px-4 md:px-10 grid lg:grid-cols-2 gap-12 items-start">
                    <div className="reveal min-w-0">
                        <p className="label-strong mb-4">Tallas del cuerpo</p>
                        <div className="overflow-x-auto">
                            <table className="spec">
                                <thead><tr><th scope="col">Talla</th><th scope="col">MX</th><th scope="col">EU</th><th scope="col">US</th><th scope="col">Pecho</th><th scope="col">Cintura</th><th scope="col">Estatura</th><th scope="col">Peso</th><th scope="col">Cuello</th></tr></thead>
                                <tbody>
                                    {catalog.sizes.map(s => (
                                        <tr key={s.id}>
                                            <td><span className="label-strong">{s.id}</span> {s.label}</td>
                                            <td>{s.mx}</td><td>{s.eu}</td><td>{s.us}</td>
                                            <td>{s.body.chest_cm.join('–')}</td><td>{s.body.waist_cm.join('–')}</td>
                                            <td>{s.body.height_cm.join('–')}</td><td>{s.body.weight_kg.join('–')}</td><td>{s.body.neck_cm.join('–')}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                        <p className="note text-ink-500 text-[15px] mt-3">Centímetros y kilos del cuerpo, no de la prenda. Si estás entre dos tallas, elige la mayor y entallamos la cintura.</p>
                    </div>
                    <div className="reveal min-w-0"><SizeFinder catalog={catalog} /></div>
                </section>

                <section id="medirte" className="max-w-[1400px] mx-auto px-4 md:px-10 pt-20 scroll-mt-24">
                    <hr className="rule-gold mb-12" />
                    <p className="label text-gold">Cómo medirte</p>
                    <h2 className="text-3xl md:text-4xl mt-2">Una cinta, una camisa y alguien que ayude</h2>
                    <ol className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8 mt-10">
                        {catalog.howToMeasure.map((m, i) => (
                            <li key={m.id} className="reveal border-t border-ink pt-4">
                                <p className="label-strong"><span className="text-gold mr-2">{String(i + 1).padStart(2, '0')}</span>{m.label}</p>
                                <p className="text-ink-700 mt-2">{m.detail}</p>
                            </li>
                        ))}
                    </ol>
                </section>

                <section id="sacos" className="max-w-[1400px] mx-auto px-4 md:px-10 pt-20 scroll-mt-24">
                    <hr className="rule-gold mb-12" />
                    <p className="label text-gold">Medidas de cada saco</p>
                    <h2 className="text-3xl md:text-4xl mt-2">El mismo M no mide igual en los tres cortes</h2>
                    <p className="text-ink-700 mt-4 max-w-2xl">El negro es entallado, con cintura marcada; el gris carbón deja más holgura para llevar suéter debajo. Compara la prenda, no solo la letra.</p>
                    <div className="flex flex-wrap gap-1 mt-8" role="tablist" aria-label="Saco">
                        {catalog.products.map((p, i) => <button key={p.id} role="tab" aria-selected={tab === i} className={`btn ${tab === i ? 'btn-rust' : 'btn-line'}`} onClick={() => setTab(i)}>{p.name.replace('Saco ', '')}</button>)}
                    </div>
                    <div className="grid lg:grid-cols-12 gap-10 mt-8 items-start" role="tabpanel">
                        <div className="lg:col-span-8 min-w-0">
                            <SpecTable product={product} catalog={catalog} />
                            <p className="note text-ink-500 text-[15px] mt-3">Prenda en plano, en centímetros. Pecho, cintura y bajo: contorno completo. Tolerancia ±1 cm.</p>
                        </div>
                        <a href={`${SHOP}/${product.slug}/`} className="lg:col-span-4 group block">
                            <Photo product={product} className="aspect-[3/4]" />
                            <p className="label-strong mt-3">{product.name} &middot; {priceRange(product)}</p>
                            <p className="label link text-rust mt-1 inline-block">Ver el saco &rarr;</p>
                        </a>
                    </div>
                </section>

                <section className="max-w-[1400px] mx-auto px-4 md:px-10 pt-20">
                    <div className="bg-ink text-parchment p-8 md:p-12 grid md:grid-cols-2 gap-8">
                        <div>
                            <p className="label text-gold">Ajuste incluido</p>
                            <p className="text-xl mt-3">{catalog.tolerances.note}</p>
                        </div>
                        <div className="md:text-right self-end">
                            <p className="note text-parchment/80">¿Pecho mayor a 118 cm o prefieres medida exacta?</p>
                            <a href={`mailto:${BRAND.email}?subject=Justo%20%C2%B7%20Saco%20a%20medida`} className="btn btn-light mt-4">Agendar una prueba</a>
                        </div>
                    </div>
                </section>
            </>
        );
    };
    renderPage(GuidePage, { current: 'tallas' });
  </script>
</body>
</html>
