<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elige tu contraseña · Casa Siego®</title>
  <!-- Destino del correo de invitación (registrar-cliente) y de recuperación. No se enlaza desde el sitio. -->
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#4A1621">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ledger&family=Bodoni+Moda:opsz,wght@6..96,600&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;1,400&family=Spectral:ital@1&display=swap">
  <link rel="stylesheet" href="../../css/site.css?v=1.1.1">
  <link rel="stylesheet" href="../../css/layout.css?v=1.1.9">
  <link rel="stylesheet" href="../../css/registro-cliente.css?v=1.0.0">
  <script src="../../js/casa.js?v=1.2.1" defer></script>
  <script src="../../js/supabase-config.js?v=1.0.0" defer></script>
  <script src="../../js/acceso-config.js?v=1.0.4" defer></script>
</head>
<body>
  <header class="terms-head">
    <p class="wordmark wordmark--colophon"><span class="wordmark__casa">CASA</span> <span class="wordmark__siego">Siego</span><sup class="wordmark__r">&reg;</sup></p>
    <p class="eyebrow eyebrow--gold">Cliente Priority</p>
    <h1 class="display">Elige tu contraseña</h1>
  </header>
  <main class="folio terms rc">
    <div class="rc__aviso" id="rc-aviso" role="status" aria-live="polite">Abriendo tu invitación&hellip;</div>
    <form class="rc__form" id="rc-form" novalidate hidden>
      <fieldset>
        <div class="rc__grid">
          <label>Contraseña nueva <span class="rc__u">12 caracteres o más, con mayúscula, minúscula y número</span>
            <input name="pw" type="password" autocomplete="new-password" required minlength="12"></label>
          <label>Repítela <span class="rc__u">&nbsp;</span>
            <input name="pw2" type="password" autocomplete="new-password" required minlength="12"></label>
        </div>
      </fieldset>
      <p class="rc__error" id="rc-error" role="alert" hidden></p>
      <button class="button" type="submit">Guardar y entrar &rarr;</button>
    </form>
  </main>
  <script>
  // El enlace del correo trae la sesión en el fragmento (#access_token…&type=invite|recovery): flujo implícito,
  // porque la invitación la emite el servidor (auth.admin) y no hay verificador PKCE en este navegador.
  window.addEventListener('DOMContentLoaded', function () {
    'use strict';
    var CFG = window.CASASIEGO_ACCESO || {};
    var aviso = document.getElementById('rc-aviso'), form = document.getElementById('rc-form'), err = document.getElementById('rc-error');
    var REGLA = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{12,}$/;
    if (!CFG.supabaseUrl || !CFG.publishableKey) { aviso.textContent = 'El acceso de clientes aún no está activo.'; return; }
    var s = document.createElement('script');
    s.src = CFG.supabaseJs; s.crossOrigin = 'anonymous';
    s.onerror = function () { aviso.textContent = 'No se pudo cargar el acceso. Revisa tu conexión y recarga.'; };
    s.onload = function () {
      var client = window.supabase.createClient(CFG.supabaseUrl, CFG.publishableKey, {
        auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true }
      });
      client.auth.getSession().then(function (r) {
        if (!r.data || !r.data.session) {
          aviso.textContent = 'Este enlace ya se usó o caducó. Pide uno nuevo a tu representante de Casa Siego.';
          return;
        }
        history.replaceState(null, '', location.pathname);     // quita el token de la barra de direcciones
        aviso.textContent = 'Hola' + (r.data.session.user.user_metadata && r.data.session.user.user_metadata.nombre ? ', ' + r.data.session.user.user_metadata.nombre : '') + '. Elige tu contraseña para entrar a Casa Siego.';
        form.hidden = false;
        form.elements.pw.focus();
      });
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var a = form.elements.pw.value, b = form.elements.pw2.value;
        err.hidden = true;
        if (!REGLA.test(a)) { err.textContent = 'Usa 12 caracteres o más, con al menos una mayúscula, una minúscula y un número.'; err.hidden = false; return; }
        if (a !== b) { err.textContent = 'Las contraseñas no coinciden.'; err.hidden = false; return; }
        form.querySelector('button').disabled = true;
        client.auth.updateUser({ password: a }).then(function (r) {
          if (r.error) throw r.error;
          aviso.textContent = 'Encantados de volvernos a encontrar.';
          form.hidden = true;
          setTimeout(function () { location.href = '../../cuenta/'; }, 1600);
        }).catch(function (x) {
          console.error('[casasiego] contraseña:', x);
          err.textContent = 'No se pudo guardar la contraseña. Inténtalo de nuevo.'; err.hidden = false;
          form.querySelector('button').disabled = false;
        });
      });
    };
    document.head.appendChild(s);
  });
  </script>
</body>
</html>
