<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bolsa · Tienda Justo · Casa Siego®</title>
  <meta name="description" content="Revisa tus sacos, elige entrega y forma de pago, y confirma tu pedido.">
  <link rel="canonical" href="https://casasiego.com/brands/justo/tienda/bolsa/">
  <meta property="og:title" content="Bolsa · Tienda Justo · Casa Siego">
  <meta property="og:description" content="Revisa tus sacos, elige entrega y forma de pago, y confirma tu pedido.">
  <meta property="og:url" content="https://casasiego.com/brands/justo/tienda/bolsa/">
  <meta property="og:locale" content="es_MX">
  <meta property="og:image" content="https://casasiego.com/images/casa/traje-01.jpg">
  <meta name="theme-color" content="#4A1621">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, noai, noimageai">
  <!-- Derechos: aviso de copyright y exclusión de minería de textos y datos / entrenamiento de IA -->
  <meta name="copyright" content="© 2026 Casa Siego®. Todos los derechos reservados.">
  <meta name="tdm-reservation" content="1">
  <meta name="tdm-policy" content="https://casasiego.com/terms.html">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../../../brands/justo/tienda/js/tailwind.config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ledger&family=Bodoni+Moda:opsz,wght@6..96,600&family=Cinzel:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Spectral:ital@1&display=swap">
  <link rel="stylesheet" href="../../../../brands/justo/tienda/css/tienda.css?v=1.0.0">

  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="../../../../js/region.js?v=1.1.0" defer></script>
</head>
<body data-root="../../../../">

  <div id="root"></div>
  <noscript><p style="padding:2rem;font-family:Georgia,serif">La tienda necesita JavaScript. Escríbenos a <a href="mailto:info@casasiego.com">info@casasiego.com</a> para hacer tu pedido.</p></noscript>

  <script type="text/babel" src="../../../../brands/justo/tienda/js/tienda.jsx?v=1.1.1"></script>
  <script type="text/babel">
    // Etapa 1 checkout: the order is saved in this browser (db.createOrder) and sent by email; Justo replies with the card
    // payment link or the SPEI details. Etapa 2: db.createOrder → Edge Function (re-prices) → Stripe / Mercado Pago.
    // Payment depends on delivery (tienda.json): pickup at Casa Siego → card, SPEI or cash; shipping → card or SPEI.
    const EMPTY = { name: '', email: '', phone: '', chest: '', height: '', street: '', colonia: '', zip: '', city: '', notes: '', consent: false };

    const Option = ({ name, value, checked, onChange, title, detail, right, disabled }) => (
        <label className={`flex gap-4 items-start border-t border-line py-4 ${disabled ? 'opacity-40' : 'cursor-pointer'}`}>
            <input type="radio" name={name} value={value} checked={checked} onChange={onChange} disabled={disabled} className="mt-1.5 accent-[#6B1E2C]" />
            <span className="flex-1"><span className="label-strong block">{title}</span><span className="text-[15px] text-ink-500">{detail}</span></span>
            {right && <span className="label text-right">{right}</span>}
        </label>
    );

    const BagPage = () => {
        const catalog = useCatalog();
        const lines = useBagLines(catalog);
        const [shippingId, setShippingId] = useState('casa');
        const [paymentId, setPaymentId] = useState('tarjeta');
        const [form, setForm] = useState(EMPTY);
        const [sent, setSent] = useState(null);
        const f = (key) => ({ value: form[key], onChange: (e) => setForm({ ...form, [key]: e.target.value }) });

        if (sent) return (
            <PageHero kicker={`Pedido ${sent.order.id}`} title="Gracias. Recibimos tu pedido."
                intro={`Abrimos tu correo con el detalle para enviarlo a ${BRAND.email}. Te respondemos con ${sent.order.payment_id === 'spei' ? 'la CLABE y la referencia' : sent.order.payment_id === 'efectivo' ? 'la fecha de tu prueba' : 'la liga de pago con tarjeta'} en horario de atención.`}>
                <p className="note text-ink-500 mt-6 max-w-2xl">¿No se abrió tu correo? Copia el pedido y envíalo a {BRAND.email} con la referencia {sent.order.id}.</p>
                <textarea readOnly className="w-full max-w-2xl mt-4 p-4 border border-line bg-parchment-100 text-[14px] font-mono" rows="10" value={sent.text} onFocus={e => e.target.select()} aria-label="Detalle del pedido" />
                <div className="flex flex-wrap gap-2 mt-8"><a href={`${SHOP}/`} className="btn btn-rust">Seguir comprando</a><a href={`${ROOT}brands/justo/`} className="btn btn-line">Volver a Justo</a></div>
            </PageHero>
        );
        if (catalog.status !== 'ready') return <PageHero kicker="Bolsa" title="Bolsa">{catalog.status === 'error' && <LoadError />}</PageHero>;
        if (lines.length === 0) return (
            <PageHero kicker="Bolsa" title="Tu bolsa está vacía." intro="Tres sacos de la casa te esperan, en cuatro tallas.">
                <a href={`${SHOP}/`} className="btn btn-rust mt-10">Ver los sacos</a>
            </PageHero>
        );

        const rules = catalog.rules;
        const priced = priceBag(lines, rules, shippingId);
        const allowed = priced.method.payments;
        const payment = allowed.includes(paymentId) ? paymentId : allowed[0];
        const delivery = shippingId !== 'casa';
        const paymentLabel = rules.payments.find(p => p.id === payment).label;
        const madeToOrder = lines.some(l => l.madeToOrder);
        const nextTier = [...rules.volume].sort((a, b) => a.min_qty - b.min_qty).find(v => v.min_qty > priced.pieces);

        const submit = (e) => {
            e.preventDefault();
            const order = db.createOrder({ customer: form, shippingId, paymentId: payment, priced });
            const text = [
                `Hola Justo, quiero confirmar mi pedido ${order.id}:`,
                '',
                ...priced.lines.map(l => `• ${l.qty} × ${l.product.name} (${l.product.sku}) talla ${l.size} · ${catalog.size[l.size].label}${l.monogram ? `, monograma «${l.monogram}»` : ''}${l.madeToOrder ? ' [sobre pedido]' : ''} — ${formatPrice(l.qty * l.product.price_mxn)}`),
                '',
                priced.discount > 0 && `Descuento (${priced.tier.pct} %): −${formatPrice(priced.discount)}`,
                priced.monogram > 0 && `Monograma (${priced.monoPieces}): ${formatPrice(priced.monogram)}`,
                `${priced.method.label}: ${priced.shipping ? formatPrice(priced.shipping) : 'sin costo'}`,
                `Total (IVA incluido): ${formatPrice(priced.total)}`,
                `Pago: ${paymentLabel}`,
                '',
                `${form.name} · ${form.email} · ${form.phone}`,
                (form.chest || form.height) && `Medidas: pecho ${form.chest || '—'} cm, estatura ${form.height || '—'} cm`,
                delivery && `Entrega: ${form.street}, ${form.colonia}, ${form.zip}, ${form.city}`,
                form.notes && `Notas: ${form.notes}`,
            ].filter(x => x !== false && x !== '' && x != null).join('\n');
            window.location.href = `mailto:${BRAND.email}?subject=${encodeURIComponent(`Justo · Pedido ${order.id}`)}&body=${encodeURIComponent(text)}`;
            bag.clear();
            setSent({ order, text });
        };

        return (
            <>
                <section className="max-w-[1400px] mx-auto px-4 md:px-10 pt-14 md:pt-20 pb-6">
                    <p className="label text-gold">Tienda Justo</p>
                    <h1 className="text-5xl md:text-6xl mt-3">Bolsa <span className="text-ink-300">({priced.pieces})</span></h1>
                </section>
                <form onSubmit={submit} className="max-w-[1400px] mx-auto px-4 md:px-10 grid lg:grid-cols-12 gap-12">
                    <div className="lg:col-span-7 space-y-14">
                        <ul className="divide-y divide-line border-y border-line">
                            {lines.map(l => {
                                const spec = l.product.specs[l.size];
                                return (
                                    <li key={l.key} className="py-5 flex gap-4">
                                        <a href={`${SHOP}/${l.product.slug}/`} className="shrink-0"><Photo product={l.product} className="w-24 md:w-32 aspect-[3/4]" /></a>
                                        <div className="flex-1 min-w-0 space-y-1">
                                            <p className="flex justify-between gap-3"><span className="font-section font-semibold">{l.product.name}</span><span className="label whitespace-nowrap">{formatPrice(l.qty * l.product.price_mxn)}</span></p>
                                            <p className="text-ink-700">Talla {l.size} · {catalog.size[l.size].label} <span className="text-ink-500">(MX {catalog.size[l.size].mx})</span>{l.monogram ? ` · Monograma ${l.monogram}` : ''}</p>
                                            <p className="text-[14px] text-ink-500">Pecho {cm(spec.chest)} · hombro {cm(spec.shoulder)} · manga {cm(spec.sleeve)} · largo {cm(spec.length)}</p>
                                            <p className={`label ${l.madeToOrder ? 'text-rust' : 'text-ink-500'}`}>{stockText(l.product, l.size, rules)}</p>
                                            <div className="flex items-center gap-4 pt-2">
                                                <div className="flex items-center border border-line">
                                                    <button type="button" className="w-9 h-9" onClick={() => bag.set(l.key, l.qty - 1)} aria-label={`Uno menos de ${l.product.name}`}>−</button>
                                                    <span className="w-6 text-center">{l.qty}</span>
                                                    <button type="button" className="w-9 h-9" onClick={() => bag.set(l.key, Math.min(20, l.qty + 1))} aria-label={`Uno más de ${l.product.name}`}>+</button>
                                                </div>
                                                <button type="button" className="label link text-ink-500" onClick={() => bag.set(l.key, 0)}>Eliminar</button>
                                            </div>
                                        </div>
                                    </li>
                                );
                            })}
                        </ul>

                        <fieldset>
                            <legend className="label-strong mb-4">Entrega</legend>
                            {rules.shipping.map(s => <Option key={s.id} name="shipping" value={s.id} checked={shippingId === s.id} onChange={() => setShippingId(s.id)}
                                title={s.label} detail={s.detail} right={s.cost_mxn ? <>{formatPrice(s.cost_mxn)}<br />gratis desde {formatPrice(s.free_from_mxn)}</> : 'Sin costo'} />)}
                        </fieldset>

                        <fieldset>
                            <legend className="label-strong mb-4">Forma de pago</legend>
                            {rules.payments.map(p => <Option key={p.id} name="payment" value={p.id} checked={payment === p.id} onChange={() => setPaymentId(p.id)}
                                title={p.label} detail={p.detail} disabled={!allowed.includes(p.id)} />)}
                        </fieldset>

                        <fieldset className="grid sm:grid-cols-2 gap-x-8 gap-y-5">
                            <legend className="label-strong mb-4">Datos</legend>
                            <input className="field sm:col-span-2" placeholder="Nombre completo" required autoComplete="name" {...f('name')} />
                            <input className="field" type="tel" placeholder="Teléfono / WhatsApp" required autoComplete="tel" {...f('phone')} />
                            <input className="field" type="email" placeholder="Email" required autoComplete="email" {...f('email')} />
                            <input className="field" type="number" inputMode="numeric" min="70" max="140" placeholder="Pecho en cm (opcional)" {...f('chest')} />
                            <input className="field" type="number" inputMode="numeric" min="140" max="210" placeholder="Estatura en cm (opcional)" {...f('height')} />
                            {delivery && <>
                                <input className="field sm:col-span-2" placeholder="Calle y número" required autoComplete="street-address" {...f('street')} />
                                <input className="field" placeholder="Colonia" required {...f('colonia')} />
                                <input className="field" placeholder="Código postal" required inputMode="numeric" pattern="[0-9]{5}" autoComplete="postal-code" {...f('zip')} />
                                <input className="field sm:col-span-2" placeholder="Alcaldía o municipio, estado" required autoComplete="address-level2" {...f('city')} />
                            </>}
                            <textarea className="field sm:col-span-2" rows="2" maxLength={400} placeholder="Notas: coderas, fecha del evento, ajustes (opcional)" {...f('notes')} />
                            <p className="note text-ink-500 text-[15px] sm:col-span-2">Con tu pecho y estatura el taller revisa la talla antes de cobrar.</p>
                        </fieldset>
                    </div>

                    <aside className="lg:col-span-4 lg:col-start-9 lg:sticky lg:top-28 self-start border-t border-ink pt-6">
                        <dl className="space-y-3">
                            <div className="flex justify-between"><dt>Sacos ({priced.pieces})</dt><dd>{formatPrice(priced.subtotal)}</dd></div>
                            {priced.discount > 0 && <div className="flex justify-between text-rust"><dt>Descuento {priced.tier.pct} %</dt><dd>−{formatPrice(priced.discount)}</dd></div>}
                            {priced.monogram > 0 && <div className="flex justify-between"><dt>Monograma ({priced.monoPieces})</dt><dd>{formatPrice(priced.monogram)}</dd></div>}
                            <div className="flex justify-between"><dt>{priced.method.label}</dt><dd>{priced.shipping ? formatPrice(priced.shipping) : 'Sin costo'}</dd></div>
                            <div className="flex justify-between text-xl font-section font-semibold pt-4 border-t border-line"><dt>Total</dt><dd>{formatPrice(priced.total)}</dd></div>
                        </dl>
                        <p className="label text-ink-500 mt-2">IVA incluido · Pago: {paymentLabel}</p>
                        {nextTier && <p className="note text-ink-700 mt-4">Añade {nextTier.min_qty - priced.pieces} {nextTier.min_qty - priced.pieces === 1 ? 'saco' : 'sacos'} más y obtén {nextTier.pct} % de descuento.</p>}
                        {delivery && priced.shipping > 0 && <p className="note text-ink-700 mt-2">Te faltan {formatPrice(priced.method.free_from_mxn - (priced.subtotal - priced.discount))} para el envío sin costo.</p>}
                        {madeToOrder && <p className="note text-rust mt-2">Hay tallas sobre pedido: tu pedido sale completo en {rules.made_to_order_days} días.</p>}
                        <label className="flex gap-3 text-[15px] text-ink-700 mt-8">
                            <input type="checkbox" required checked={form.consent} onChange={e => setForm({ ...form, consent: e.target.checked })} className="mt-1 accent-[#6B1E2C]" />
                            <span>Acepto los <a href={`${ROOT}terms.html`} className="underline">términos de uso</a> y que Justo use mis datos solo para este pedido.</span>
                        </label>
                        <button className="btn btn-rust w-full mt-6">Confirmar pedido</button>
                        <p className="note text-ink-500 text-[15px] mt-3">Se abre tu correo con el pedido para {BRAND.email}; te respondemos con {payment === 'spei' ? 'la CLABE' : payment === 'efectivo' ? 'la fecha de tu prueba' : 'la liga de pago'}.</p>
                    </aside>
                </form>
            </>
        );
    };

    renderPage(BagPage);
  </script>
</body>
</html>
